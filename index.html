<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Search Bar Header */
    .search-header {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      backdrop-filter: blur(12px);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .search-btn:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    /* Current Weather Card */
    .current-weather-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .city-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .current-date {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .weather-icon {
      font-size: 4.5rem;
      line-height: 1;
    }

    .temperature-wrap {
      display: flex;
      flex-direction: column;
    }

    .temperature {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .condition {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: capitalize;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      border-top: 1px solid var(--card-border);
      padding-top: 24px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Forecast Section */
    .forecast-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .forecast-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 12px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .forecast-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .forecast-day {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .forecast-date {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    .forecast-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .forecast-temp {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .forecast-temp .min-temp {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.9rem;
      margin-left: 4px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .forecast-grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }
    }

    @media (max-width: 480px) {
      .current-weather-card {
        padding: 24px 20px;
      }
      .city-name {
        font-size: 1.75rem;
      }
      .temperature {
        font-size: 3.5rem;
      }
      .weather-icon {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Search Bar -->
    <header class="search-header">
      <div class="search-input-wrapper">
        <input type="text" id="cityInput" class="search-input" placeholder="Enter city name..." value="New York">
      </div>
      <button id="searchBtn" class="search-btn">Search</button>
    </header>

    <!-- Current Weather -->
    <main class="current-weather-card">
      <div class="location-header">
        <div>
          <h1 id="cityName" class="city-name">New York, US</h1>
          <p id="currentDate" class="current-date">Thursday, Aug 6, 2026</p>
        </div>
      </div>

      <div class="weather-main">
        <span class="weather-icon" id="currentIcon">☀️</span>
        <div class="temperature-wrap">
          <div class="temperature"><span id="currentTemp">72</span>°F</div>
          <div class="condition" id="currentCondition">Clear Sky</div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Wind Speed</div>
          <div class="metric-value" id="windSpeed">8 mph</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Humidity</div>
          <div class="metric-value" id="humidity">45%</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Pressure</div>
          <div class="metric-value" id="pressure">1014 hPa</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">UV Index</div>
          <div class="metric-value" id="uvIndex">6 (Moderate)</div>
        </div>
      </div>
    </main>

    <!-- 5-Day Forecast -->
    <section class="forecast-section">
      <h2 class="section-title">5-Day Forecast</h2>
      <div class="forecast-grid" id="forecastGrid">
        <!-- Generated via JavaScript -->
      </div>
    </section>

  </div>

  <script>
    const weatherData = {
      cityName: "New York, US",
      temp: 72,
      condition: "Clear Sky",
      icon: "☀️",
      wind: "8 mph",
      humidity: "45%",
      pressure: "1014 hPa",
      uv: "6 (Moderate)",
      forecast: [
        { day: "Fri", date: "Aug 7", icon: "🌤️", maxTemp: 75, minTemp: 62 },
        { day: "Sat", date: "Aug 8", icon: "🌧️", maxTemp: 68, minTemp: 58 },
        { day: "Sun", date: "Aug 9", icon: "⛈️", maxTemp: 70, minTemp: 60 },
        { day: "Mon", date: "Aug 10", icon: "⛅", maxTemp: 73, minTemp: 61 },
        { day: "Tue", date: "Aug 11", icon: "☀️", maxTemp: 78, minTemp: 65 }
      ]
    };

    function renderWeather(data) {
      document.getElementById('cityName').textContent = data.cityName;
      document.getElementById('currentTemp').textContent = data.temp;
      document.getElementById('currentCondition').textContent = data.condition;
      document.getElementById('currentIcon').textContent = data.icon;
      document.getElementById('windSpeed').textContent = data.wind;
      document.getElementById('humidity').textContent = data.humidity;
      document.getElementById('pressure').textContent = data.pressure;
      document.getElementById('uvIndex').textContent = data.uv;

      const forecastGrid = document.getElementById('forecastGrid');
      forecastGrid.innerHTML = '';

      data.forecast.forEach(item => {
        const card = document.createElement('div');
        card.className = 'forecast-card';
        card.innerHTML = `
          <div class="forecast-day">${item.day}</div>
          <div class="forecast-date">${item.date}</div>
          <div class="forecast-icon">${item.icon}</div>
          <div class="forecast-temp">${item.maxTemp}°<span class="min-temp">${item.minTemp}°</span></div>
        `;
        forecastGrid.appendChild(card);
      });
    }

    renderWeather(weatherData);

    function performSearch() {
      const input = document.getElementById('cityInput');
      const city = input.value.trim();
      if (city) {
        weatherData.cityName = city.charAt(0).toUpperCase() + city.slice(1);
        weatherData.temp = Math.floor(Math.random() * (85 - 55 + 1)) + 55;
        renderWeather(weatherData);
      }
    }

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
