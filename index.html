<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Search Header */
    .search-header {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      backdrop-filter: blur(12px);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .search-btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .status-msg {
      color: #f43f5e;
      font-size: 0.9rem;
      display: none;
    }

    /* Current Weather Card */
    .current-weather-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .city-name {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .current-date {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 24px 0 32px 0;
    }

    .weather-icon {
      font-size: 4.5rem;
      line-height: 1;
    }

    .temperature {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .condition {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      border-top: 1px solid var(--card-border);
      padding-top: 24px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Forecast Section */
    .forecast-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .forecast-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 12px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .forecast-day {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .forecast-icon {
      font-size: 2.2rem;
      margin: 10px 0;
    }

    .forecast-temp {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .forecast-temp .min-temp {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .forecast-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Search Bar -->
    <header class="search-header">
      <input type="text" id="zipInput" class="search-input" placeholder="Enter US Zip Code or City (e.g. 13034)" value="13034">
      <button id="searchBtn" class="search-btn">Search</button>
    </header>
    <div id="statusMsg" class="status-msg"></div>

    <!-- Current Weather Card -->
    <main class="current-weather-card">
      <div class="location-header">
        <h1 id="cityName" class="city-name">Loading 13034...</h1>
        <p id="currentDate" class="current-date"></p>
      </div>

      <div class="weather-main">
        <span class="weather-icon" id="currentIcon">🌤️</span>
        <div>
          <div class="temperature"><span id="currentTemp">--</span>°F</div>
          <div class="condition" id="currentCondition">Fetching live data...</div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Wind</div>
          <div class="metric-value" id="windSpeed">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Humidity</div>
          <div class="metric-value" id="humidity">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Dew Point</div>
          <div class="metric-value" id="dewPoint">--</div>
        </div>
      </div>
    </main>

    <!-- 5-Day Forecast -->
    <section class="forecast-section">
      <h2>5-Day Forecast</h2>
      <div class="forecast-grid" id="forecastGrid">
        <!-- Generated dynamically -->
      </div>
    </section>

  </div>

  <script>
    function getWeatherIcon(shortForecast) {
      const text = shortForecast.toLowerCase();
      if (text.includes('thunder') || text.includes('storm')) return '⛈️';
      if (text.includes('rain') || text.includes('shower')) return '🌧️';
      if (text.includes('snow') || text.includes('sleet')) return '❄️';
      if (text.includes('cloud') || text.includes('overcast')) return '⛅';
      if (text.includes('fog')) return '🌫️';
      return '☀️';
    }

    async function fetchWeatherByQuery(query) {
      const statusEl = document.getElementById('statusMsg');
      statusEl.style.display = 'none';

      try {
        let lat, lon, locationName;

        if (/^\d{5}$/.test(query)) {
          const zipRes = await fetch(`https://api.zippopotam.us/us/${query}`);
          if (!zipRes.ok) throw new Error("Zip code not found.");
          const zipData = await zipRes.json();
          lat = zipData.places[0].latitude;
          lon = zipData.places[0].longitude;
          locationName = `${zipData.places[0]['place name']}, ${zipData.places[0]['state abbreviation']} (${query})`;
        } else {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&q=${encodeURIComponent(query)}`);
          const geoData = await geoRes.json();
          if (!geoData.length) throw new Error("Location not found.");
          lat = geoData[0].lat;
          lon = geoData[0].lon;
          locationName = geoData[0].display_name.split(',')[0];
        }

        const pointsRes = await fetch(`https://api.weather.gov/points/${lat},${lon}`);
        if (!pointsRes.ok) throw new Error("Weather data unavailable for this area.");
        const pointsData = await pointsRes.json();

        const forecastUrl = pointsData.properties.forecast;
        const forecastGridUrl = pointsData.properties.forecastGridData;

        const [forecastRes, gridRes] = await Promise.all([
          fetch(forecastUrl).then(r => r.json()),
          fetch(forecastGridUrl).then(r => r.json())
        ]);

        const periods = forecastRes.properties.periods;

        const current = periods[0];
        document.getElementById('cityName').textContent = locationName;
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        document.getElementById('currentTemp').textContent = current.temperature;
        document.getElementById('currentCondition').textContent = current.shortForecast;
        document.getElementById('currentIcon').textContent = getWeatherIcon(current.shortForecast);
        document.getElementById('windSpeed').textContent = current.windSpeed;

        const humidityVal = gridRes.properties.relativeHumidity.values[0]?.value;
        document.getElementById('humidity').textContent = humidityVal ? `${Math.round(humidityVal)}%` : 'N/A';

        const dewVal = gridRes.properties.dewpoint.values[0]?.value;
        document.getElementById('dewPoint').textContent = dewVal ? `${Math.round((dewVal * 9/5) + 32)}°F` : 'N/A';

        const forecastGrid = document.getElementById('forecastGrid');
        forecastGrid.innerHTML = '';

        const dayPeriods = periods.filter(p => p.isDaytime).slice(0, 5);

        dayPeriods.forEach(p => {
          const card = document.createElement('div');
          card.className = 'forecast-card';
          card.innerHTML = `
            <div class="forecast-day">${p.name}</div>
            <div class="forecast-icon">${getWeatherIcon(p.shortForecast)}</div>
            <div class="forecast-temp">${p.temperature}°F</div>
          `;
          forecastGrid.appendChild(card);
        });

      } catch (err) {
        statusEl.textContent = err.message || "Failed to fetch weather data.";
        statusEl.style.display = 'block';
      }
    }

    fetchWeatherByQuery('13034');

    document.getElementById('searchBtn').addEventListener('click', () => {
      const q = document.getElementById('zipInput').value.trim();
      if (q) fetchWeatherByQuery(q);
    });

    document.getElementById('zipInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const q = e.target.value.trim();
        if (q) fetchWeatherByQuery(q);
      }
    });
  </script>
</body>
</html>
