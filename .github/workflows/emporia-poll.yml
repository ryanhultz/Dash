name: Poll Emporia Vue

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — GitHub's practical minimum
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the job can commit emporia-data.json back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyemvue

      - name: Poll Emporia and write emporia-data.json
        env:
          EMPORIA_EMAIL: ${{ secrets.EMPORIA_EMAIL }}
          EMPORIA_PASSWORD: ${{ secrets.EMPORIA_PASSWORD }}
        run: python scripts/poll_emporia.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add emporia-data.json
          git diff --staged --quiet || git commit -m "Update Emporia data"
          git push
